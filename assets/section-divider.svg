<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 14" width="100%" height="14" preserveAspectRatio="none">
  <defs>
    <style>
      @keyframes pulse-travel {
        0% { transform: translateX(-200px); opacity: 0; }
        25% { opacity: 0.7; }
        75% { opacity: 0.7; }
        100% { transform: translateX(1200px); opacity: 0; }
      }
      .stream { animation: pulse-travel 6s ease-in-out infinite; }
    </style>
    <linearGradient id="div-track" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0"/>
      <stop offset="30%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="div-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Slim base line -->
  <line x1="80" y1="7" x2="1120" y2="7" stroke="url(#div-track)" stroke-width="1"/>

  <!-- Subtle moving pulse stream -->
  <g class="stream">
    <line x1="0" y1="7" x2="180" y2="7" stroke="url(#div-pulse)" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
