<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 45" width="600" height="45">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&amp;display=swap');
      
      .text-item {
        font-family: 'Fira Code', 'JetBrains Mono', monospace;
        font-size: 17px;
        font-weight: 600;
        fill: #22d3ee;
        letter-spacing: 0.5px;
        opacity: 0;
      }
      
      .cursor {
        animation: blink 0.8s step-end infinite;
        fill: #8b5cf6;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* 16s Total Duration: 4 phrases x 4s each */
      @keyframes cycle-phrase-1 {
        0% { opacity: 0; }
        3% { opacity: 1; }
        22% { opacity: 1; }
        25% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes cycle-phrase-2 {
        0%, 25% { opacity: 0; }
        28% { opacity: 1; }
        47% { opacity: 1; }
        50% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes cycle-phrase-3 {
        0%, 50% { opacity: 0; }
        53% { opacity: 1; }
        72% { opacity: 1; }
        75% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes cycle-phrase-4 {
        0%, 75% { opacity: 0; }
        78% { opacity: 1; }
        97% { opacity: 1; }
        100% { opacity: 0; }
      }

      .p1 { animation: cycle-phrase-1 16s infinite; }
      .p2 { animation: cycle-phrase-2 16s infinite; }
      .p3 { animation: cycle-phrase-3 16s infinite; }
      .p4 { animation: cycle-phrase-4 16s infinite; }
    </style>
  </defs>

  <rect width="600" height="45" fill="none"/>
  
  <g transform="translate(300, 28)">
    <text text-anchor="middle">
      <tspan class="text-item p1">&gt; Data Science &amp; Analytics</tspan>
      <tspan class="text-item p2">&gt; Machine Learning &amp; AI</tspan>
      <tspan class="text-item p3">&gt; Python &amp; SQL</tspan>
      <tspan class="text-item p4">&gt; Building Data-Driven Applications</tspan>
    </text>
    <rect x="175" y="-14" width="7" height="18" class="cursor"/>
  </g>
</svg>
