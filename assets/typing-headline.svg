<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 36" width="500" height="36">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&amp;display=swap');
      
      .role-text {
        font-family: 'Fira Code', 'JetBrains Mono', monospace;
        font-size: 16.5px;
        font-weight: 600;
        fill: #22d3ee;
        letter-spacing: 0.5px;
      }

      .cursor {
        fill: #8b5cf6;
        animation: cursor-blink 0.8s step-end infinite;
      }

      @keyframes cursor-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* 16s Total Duration: 4 phrases x 4s each */
      @keyframes phrase-fade-1 {
        0% { opacity: 0; transform: translateY(6px); }
        3%, 22% { opacity: 1; transform: translateY(0); }
        25%, 100% { opacity: 0; transform: translateY(-6px); }
      }

      @keyframes phrase-fade-2 {
        0%, 25% { opacity: 0; transform: translateY(6px); }
        28%, 47% { opacity: 1; transform: translateY(0); }
        50%, 100% { opacity: 0; transform: translateY(-6px); }
      }

      @keyframes phrase-fade-3 {
        0%, 50% { opacity: 0; transform: translateY(6px); }
        53%, 72% { opacity: 1; transform: translateY(0); }
        75%, 100% { opacity: 0; transform: translateY(-6px); }
      }

      @keyframes phrase-fade-4 {
        0%, 75% { opacity: 0; transform: translateY(6px); }
        78%, 97% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-6px); }
      }

      .p1 { animation: phrase-fade-1 16s ease-in-out infinite; }
      .p2 { animation: phrase-fade-2 16s ease-in-out infinite; }
      .p3 { animation: phrase-fade-3 16s ease-in-out infinite; }
      .p4 { animation: phrase-fade-4 16s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="500" height="36" fill="none"/>

  <g transform="translate(250, 24)" text-anchor="middle">
    <!-- Animated phrases rotating cleanly -->
    <g class="p1">
      <text class="role-text">&gt; Data Science &amp; Analytics</text>
    </g>
    <g class="p2">
      <text class="role-text">&gt; Machine Learning &amp; AI</text>
    </g>
    <g class="p3">
      <text class="role-text">&gt; Python &amp; SQL</text>
    </g>
    <g class="p4">
      <text class="role-text">&gt; Data-Driven Applications</text>
    </g>
  </g>
</svg>
