<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <style>
      @font-face {
        font-family: 'JetBrains Mono';
        src: local('JetBrains Mono'), local('Monospace');
      }
      .bg-grid { stroke: #1e293b; stroke-width: 0.5; }
      .node { fill: #3b82f6; }
      .node-pulse { animation: pulse 3s ease-in-out infinite; }
      .node-pulse-1 { animation-delay: 0s; }
      .node-pulse-2 { animation-delay: 0.7s; }
      .node-pulse-3 { animation-delay: 1.4s; }
      .node-pulse-4 { animation-delay: 2.1s; }
      .node-pulse-5 { animation-delay: 2.8s; }
      .edge { stroke: #3b82f6; stroke-width: 0.8; opacity: 0.4; }
      .edge-flow { animation: flow 4s linear infinite; stroke-dasharray: 8 12; }
      .particle { fill: #22d3ee; opacity: 0.6; }
      .particle-drift { animation: drift 8s ease-in-out infinite; }
      .particle-drift-1 { animation-delay: 0s; }
      .particle-drift-2 { animation-delay: 1.5s; }
      .particle-drift-3 { animation-delay: 3s; }
      .particle-drift-4 { animation-delay: 4.5s; }
      .particle-drift-5 { animation-delay: 6s; }
      .title-main { font-family: 'JetBrains Mono', monospace; font-weight: 700; fill: #f8fafc; font-size: 42px; }
      .title-role { font-family: 'JetBrains Mono', monospace; font-weight: 500; fill: #94a3b8; font-size: 22px; }
      .title-desc { font-family: 'JetBrains Mono', monospace; font-weight: 400; fill: #64748b; font-size: 16px; }
      .accent-line { stroke: #8b5cf6; stroke-width: 2; stroke-dasharray: 8 4; }
      .accent-glow { filter: drop-shadow(0 0 8px rgba(139,92,246,0.6)); animation: glow-pulse 3s ease-in-out infinite alternate; }
      @keyframes pulse {
        0%, 100% { r: 4; opacity: 0.6; }
        50% { r: 7; opacity: 1; }
      }
      @keyframes flow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 20; }
      }
      @keyframes drift {
        0%, 100% { transform: translate(0, 0); opacity: 0.4; }
        50% { transform: translate(20px, -15px); opacity: 0.8; }
      }
      @keyframes glow-pulse {
        0% { opacity: 0.6; }
        100% { opacity: 1; }
      }
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in-1 { animation: fade-in-up 0.8s 0.2s both; }
      .fade-in-2 { animation: fade-in-up 0.8s 0.4s both; }
      .fade-in-3 { animation: fade-in-up 0.8s 0.6s both; }
      .fade-in-4 { animation: fade-in-up 0.8s 0.8s both; }
    </style>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <line class="bg-grid" x1="0" y1="0" x2="40" y2="0"/>
      <line class="bg-grid" x1="0" y1="0" x2="0" y2="40"/>
    </pattern>
    <!-- Gradient for title accent -->
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="role-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="1200" height="400" fill="#0a0f1a"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Animated network nodes and edges -->
  <g class="network-layer">
    <!-- Edges connecting nodes -->
    <line class="edge edge-flow" x1="180" y1="120" x2="320" y2="180"/>
    <line class="edge edge-flow" x1="320" y1="180" x2="480" y2="140"/>
    <line class="edge edge-flow" x1="480" y1="140" x2="650" y2="200"/>
    <line class="edge edge-flow" x1="650" y1="200" x2="800" y2="160"/>
    <line class="edge edge-flow" x1="800" y1="160" x2="950" y2="220"/>
    <line class="edge edge-flow" x1="320" y1="180" x2="200" y2="280"/>
    <line class="edge edge-flow" x1="480" y1="140" x2="380" y2="260"/>
    <line class="edge edge-flow" x1="650" y1="200" x2="580" y2="290"/>
    <line class="edge edge-flow" x1="800" y1="160" x2="920" y2="270"/>

    <!-- Nodes -->
    <circle class="node node-pulse node-pulse-1" cx="180" cy="120" r="4"/>
    <circle class="node node-pulse node-pulse-2" cx="320" cy="180" r="4"/>
    <circle class="node node-pulse node-pulse-3" cx="480" cy="140" r="4"/>
    <circle class="node node-pulse node-pulse-4" cx="650" cy="200" r="4"/>
    <circle class="node node-pulse node-pulse-5" cx="800" cy="160" r="4"/>
    <circle class="node node-pulse node-pulse-1" cx="950" cy="220" r="4"/>
    <circle class="node node-pulse node-pulse-2" cx="200" cy="280" r="4"/>
    <circle class="node node-pulse node-pulse-3" cx="380" cy="260" r="4"/>
    <circle class="node node-pulse node-pulse-4" cx="580" cy="290" r="4"/>
    <circle class="node node-pulse node-pulse-5" cx="920" cy="270" r="4"/>
  </g>

  <!-- Floating particles -->
  <g class="particles-layer">
    <circle class="particle particle-drift particle-drift-1" cx="100" cy="80" r="2"/>
    <circle class="particle particle-drift particle-drift-2" cx="1100" cy="100" r="1.5"/>
    <circle class="particle particle-drift particle-drift-3" cx="200" cy="320" r="2"/>
    <circle class="particle particle-drift particle-drift-4" cx="1050" cy="300" r="1.5"/>
    <circle class="particle particle-drift particle-drift-5" cx="600" cy="50" r="2"/>
    <circle class="particle particle-drift particle-drift-1" cx="400" cy="350" r="1.5"/>
    <circle class="particle particle-drift particle-drift-2" cx="850" cy="60" r="2"/>
  </g>

  <!-- Main title group -->
  <g transform="translate(100, 160)">
    <text class="title-main fade-in-1" x="0" y="0">ARJUN M BABU</text>
    <text class="title-role fade-in-2" x="0" y="55">COMPUTER SCIENCE ENGINEER</text>
    <line class="accent-line accent-glow fade-in-3" x1="0" y1="75" x2="380" y2="75"/>
    <text class="title-desc fade-in-4" x="0" y="105">Data Science • Analytics • Machine Learning • AI</text>
  </g>

  <!-- Right side: subtle tech indicators -->
  <g transform="translate(850, 160)" opacity="0.7">
    <text class="tf" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" x="0" y="0">┌─ STACK ─────────────┐</text>
    <text class="tf" font-family="'JetBrains Mono', monospace" font-size="11" fill="#3b82f6" x="0" y="20">│ Python  ████████    │</text>
    <text class="tf" font-family="'JetBrains Mono', monospace" font-size="11" fill="#3b82f6" x="0" y="36">│ SQL     ████████    │</text>
    <text class="tf" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8b5cf6" x="0" y="52">│ Pandas  ██████      │</text>
    <text class="tf" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8b5cf6" x="0" y="68">│ NumPy   ██████      │</text>
    <text class="tf" font-family="'JetBrains Mono', monospace" font-size="11" fill="#22d3ee" x="0" y="84">│ Scikit  █████       │</text>
    <text class="tf" font-family="'JetBrains Mono', monospace" font-size="11" fill="#22d3ee" x="0" y="100">│ XGBoost ████        │</text>
    <text class="tf" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" x="0" y="120">└─────────────────────┘</text>
  </g>

  <!-- Bottom accent bar -->
  <line x1="100" y1="350" x2="1100" y2="350" stroke="#1e293b" stroke-width="1" stroke-dasharray="10 10" opacity="0.5"/>
</svg>