<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <style>
      .tf { font-family: "Courier New", monospace; }
      .cursor-blink { animation: blink 1.2s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .l1 { animation: fi 0.3s 0.5s both; }
      .l2 { animation: fi 0.3s 1.2s both; }
      .l3 { animation: fi 0.3s 2.2s both; }
      .l4 { animation: fi 0.3s 2.9s both; }
      .l5 { animation: fi 0.3s 3.9s both; }
      .l6 { animation: fi 0.3s 4.6s both; }
      .l7 { animation: fi 0.3s 5.6s both; }
      .l8 { animation: fi 0.3s 6.3s both; }
      .l9 { animation: fi 0.3s 7.3s both; }
      .l10 { animation: fi 0.3s 8.0s both; }
      .l11 { animation: fi 0.3s 9.0s both; }
      .l12 { animation: fi 0.3s 9.7s both; }
      @keyframes fi { from { opacity: 0; } to { opacity: 1; } }
      .glow { animation: bg 3s ease-in-out infinite alternate; }
      @keyframes bg {
        from { filter: drop-shadow(0 0 4px rgba(59,130,246,0.3)); }
        to { filter: drop-shadow(0 0 12px rgba(59,130,246,0.6)); }
      }
    </style>
